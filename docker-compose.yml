version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333" # API REST
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Montamos el código local en /app para habilitar el hot-reload durante el desarrollo
      - ./backend:/app
    depends_on:
      - qdrant
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

  frontend:
    build: 
      context: ./frontend
      dockerfile: Dockerfile
    container_name: vue_frontend
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=${VITE_API_URL:-http://localhost:8000/api/v1}
      - VITE_DEV_MODE=${VITE_DEV_MODE:-true}
    volumes:
      - ./frontend:/app
      - /app/node_modules # Evitar sobreescribir dependencias instaladas en docker con volumen local
    depends_on:
      - backend

volumes:
  qdrant_data:
