version: '3.8'

services:
  qdrant:
    image: qdrant/qdrant:latest
    container_name: qdrant_db
    ports:
      - "6333:6333" # API REST
      - "6334:6334" # gRPC
    volumes:
      - qdrant_data:/qdrant/storage
    restart: always

  backend:
    build: 
      context: ./backend
      dockerfile: Dockerfile
    container_name: fastapi_backend
    ports:
      - "8000:8000"
    env_file:
      - .env
    volumes:
      # Montamos el código local en /app para habilitar el hot-reload durante el desarrollo
      - ./backend:/app
    depends_on:
      - qdrant
    # Comando con --reload para que el servidor se reinicie al guardar cambios en src/
    command: uvicorn src.main:app --host 0.0.0.0 --port 8000 --reload

volumes:
  qdrant_data:
